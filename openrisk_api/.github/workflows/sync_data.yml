name: Nightly Sanctions Feed Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-sanctions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run Ingestion ETL
        run: python etl.py

      - name: Commit & Push Updated Database
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/sanctions.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: nightly sanctions database update [skip ci]" && git push)
